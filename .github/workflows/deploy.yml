
name: Deploy PHP CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate PHP files
        run: |
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -print0 | xargs -0 -r -n1 php -l

      - name: Generate production config
        env:
          SAMPLE_CREDENTIAL: ${{ secrets.SAMPLE_CREDENTIAL }}
        run: |
          if [ -z "$SAMPLE_CREDENTIAL" ]; then
            echo "ERROR: SAMPLE_CREDENTIAL is missing!"
            exit 1
          fi

          mkdir -p config

          php -r '
            $value = getenv("SAMPLE_CREDENTIAL");

            $content = "<?php\n\n";
            $content .= "\$SAMPLE_CREDENTIAL = ";
            $content .= var_export($value, true);
            $content .= ";\n";

            file_put_contents("config/env.config.php", $content);
          '

      - name: Validate deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD DEPLOY_DIRECTORY; do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is missing!"
              exit 1
            fi
          done

          echo "Deployment configuration is ready."

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ secrets.DEPLOY_DIRECTORY }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            README.md