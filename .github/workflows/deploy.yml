
name: Deploy PHP CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # Use GitHub production environment
    environment: production

    steps:
      # 1. Get the latest repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install PHP for syntax validation
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # 3. Check PHP syntax
      - name: Validate PHP files
        run: |
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -print0 | xargs -0 -r -n1 php -l

      # 4. Generate production environment config
      - name: Generate production config
        env:
          SAMPLE_CREDENTIAL: ${{ secrets.SAMPLE_CREDENTIAL }}
        run: |
          if [ -z "$SAMPLE_CREDENTIAL" ]; then
            echo "ERROR: SAMPLE_CREDENTIAL is missing!"
            exit 1
          fi

          mkdir -p config

          php -r '
            $value = getenv("SAMPLE_CREDENTIAL");

            $content = "<?php\n\n";
            $content .= "\$SAMPLE_CREDENTIAL = ";
            $content .= var_export($value, true);
            $content .= ";\n";

            file_put_contents(
              "config/env.config.php",
              $content
            );
          '

      # 5. Validate FTP credentials
      - name: Validate FTP configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "ERROR: FTP_SERVER is missing!"
            exit 1
          fi

          if [ -z "$FTP_USERNAME" ]; then
            echo "ERROR: FTP_USERNAME is missing!"
            exit 1
          fi

          if [ -z "$FTP_PASSWORD" ]; then
            echo "ERROR: FTP_PASSWORD is missing!"
            exit 1
          fi

          echo "FTP configuration is ready."

      # 6. Deploy files to InfinityFree
      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          # InfinityFree website root directory
          server-dir: /htdocs/

          # Local project directory
          local-dir: ./

          # Exclude unnecessary files
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            README.md